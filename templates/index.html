<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>Arma 3 NPC 對話管理系統</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 sidebar">
            <h4 class="text-success mb-3">NPC 管理</h4>
            <div id="file-list" class="mb-4"></div>
            <hr class="border-secondary">
            <div class="mb-3">
                <label class="small text-secondary">NPC ID *</label>
                <input type="text" id="npc_id" class="form-control required-field">
            </div>
            <div class="mb-3">
                <label class="small text-secondary">顯示姓名 *</label>
                <input type="text" id="npc_name" class="form-control required-field">
            </div>
            <div class="mb-3">
                <label class="small text-secondary">動作文字 *</label>
                <input type="text" id="action" class="form-control required-field">
            </div>
            <div class="mb-4">
                <label class="small text-secondary">開場白 *</label>
                <textarea id="opening" class="form-control required-field" rows="3"></textarea>
            </div>
            <div class="d-grid gap-2">
                <button class="btn btn-primary btn-lg" onclick="saveToServer()">💾 儲存 JSON</button>
                <button class="btn btn-warning btn-lg" onclick="copySQFToClipboard(event)">📋 複製 SQF 代碼</button>
                <button class="btn btn-outline-light btn-sm mt-2" onclick="clearAllContent()">🧹 清空內容</button>
            </div>
        </div>

        <div class="col-md-9 main-content">
            <h4 class="mb-4">對話清單</h4>
            <div id="options-list"></div>
            <div class="text-center mb-5"><button class="btn btn-outline-success px-5 py-2" onclick="addOption()">＋ 新增對話選項</button></div>
            <div class="option-card leave-card" id="leave-option">
                <div class="row mb-3">
                    <div class="col-12">
                        <span class="badge bg-danger">結束對話</span>
                        <input type="text" class="form-control form-control-lg opt-title required-field" placeholder="標題 (離開)" oninput="syncDialogue(this)">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6">
                        <div class="dialogue-box"><span class="badge bg-primary">玩家說 *</span><input type="text" class="form-control player-msg required-field"></div>
                    </div>
                    <div class="col-md-6">
                        <div class="dialogue-box"><span class="badge bg-secondary">NPC 回應 *</span><input type="text" class="form-control npc-msg required-field"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script type="text/template" id="opt-tpl">
    <div class="option-card">
        <div class="btn-delete" onclick="this.closest('.option-card').remove()">✕</div>
        <div class="row mb-3">
            <div class="col-12"><input type="text" class="form-control form-control-lg opt-title required-field" placeholder="選項標題" oninput="syncDialogue(this)"></div>
        </div>
        <div class="row">
            <div class="col-md-6">
                <div class="dialogue-box"><span class="badge bg-primary">玩家說 *</span><input type="text" class="form-control player-msg required-field"></div>
            </div>
            <div class="col-md-6">
                <div class="dialogue-box"><span class="badge bg-secondary">NPC 回應 *</span><input type="text" class="form-control npc-msg required-field"></div>
            </div>
        </div>
    </div>
</script>
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
